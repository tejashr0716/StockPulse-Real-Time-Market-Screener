apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockpulse-engine
  namespace: production
  labels:
    app: stockpulse-engine
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stockpulse-engine
  template:
    metadata:
      labels:
        app: stockpulse-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3005"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: tejashr/stockpulse-engine:v2.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3005"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
